services:
  # =========================================================================
  # 1. ATS Resume Express Backend API Service
  # =========================================================================
  - type: web
    name: ats-resume-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: mongodb+srv://<user>:<password>@cluster.mongodb.net/ats_resume_studio
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PASSWORD_RESET_TOKEN_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Optional: Google Gemini API key
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: WEB_ORIGIN
        value: https://ats-resume-web.onrender.com
      - key: CORS_ORIGIN
        value: https://ats-resume-web.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://ats-agent-service.onrender.com

  # =========================================================================
  # 2. Next.js Frontend Web Application
  # =========================================================================
  - type: web
    name: ats-resume-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:frontend
    startCommand: npm run start:web
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ats-resume-api-rop9.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: "ATS Resume Intelligence Studio"

  # =========================================================================
  # 3. Python 8-Agent Multi-Agent Service (Optional / Microservice)
  # =========================================================================
  - type: web
    name: ats-agent-service
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/agents
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
